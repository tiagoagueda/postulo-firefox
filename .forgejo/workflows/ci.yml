name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that a new tag or a security fix on postulo-chromium's main turns this red
  # without anybody pushing here (scripts/check-pin.mjs).
  schedule:
    - cron: "17 5 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          # Everything after this runs code the pull request chooses (npm's lifecycle scripts,
          # then the build of the repository source.json names); the token stays out of .git/config.
          persist-credentials: false
      - run: npm ci
      - name: Refuse a high advisory in the dev chain
        # web-ext runs on a contributor's machine and in CI, not in the extension; scripts/audit.mjs
        # fails on a new high or critical advisory and names the one allowed (no fixed release).
        run: npm run audit
      - name: Test the pin check
        run: npm test
      - name: Check the pin does not move
        run: npm run check:pin
      - name: Assemble the Firefox build from the shared source
        run: npm run build
      - name: Lint it
        run: npx web-ext lint --source-dir dist
      - name: Package it
        run: npx web-ext build --source-dir dist --overwrite-dest
      # v3, on purpose. This Forgejo serves the actions from data.forgejo.org and answers
      # the artifact API as a GitHub Enterprise Server without v2 of it, so v4 ends every
      # time with "not currently supported on GHES"; v3 is the one that works here. The
      # move to v4 assumed v3 had been disabled and was uploading nothing -- the log of the
      # run it replaced says the package went up fine (postulo/postulo#251).
      - uses: actions/upload-artifact@v3
        with:
          name: firefox-package
          path: web-ext-artifacts
